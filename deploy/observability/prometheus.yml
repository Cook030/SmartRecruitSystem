global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: recruitment-web
    static_configs:
      - targets: [web-gin-service:9464]
  - job_name: recruitment-logic
    static_configs:
      - targets: [logic-grpc-service:9465]
