syntax = "proto3";

package recruit;

option go_package = "logic-grpc-service/pb";

// AuthService 处理 HR 和候选人的注册登录。
service AuthService {
  rpc HrRegister(HrRegisterRequest) returns (HrRegisterResponse);
  rpc HrLogin(HrLoginRequest) returns (HrLoginResponse);
  rpc CandidateRegister(CandidateRegisterRequest) returns (CandidateRegisterResponse);
  rpc CandidateLogin(CandidateLoginRequest) returns (CandidateLoginResponse);
}

message HrRegisterRequest {
  string username = 1;
  string password = 2;
  string name = 3;
}

message HrRegisterResponse {
  uint64 id = 1;
}

message HrLoginRequest {
  string username = 1;
  string password = 2;
}

message HrLoginResponse {
  uint64 id = 1;
  string username = 2;
  string name = 3;
}

message CandidateRegisterRequest {
  string username = 1;
  string password = 2;
}

message CandidateRegisterResponse {
  uint64 id = 1;
}

message CandidateLoginRequest {
  string username = 1;
  string password = 2;
}

message CandidateLoginResponse {
  uint64 id = 1;
  string username = 2;
}
