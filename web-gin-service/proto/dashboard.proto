syntax = "proto3";

package recruit;

option go_package = "logic-grpc-service/pb";

// DashboardService 提供 HR 仪表盘所需的统计和趋势数据。
service DashboardService {
  // 总览卡片数据：岗位、投递、候选人、简历、聊天等统计。
  rpc GetOverview(DashboardOverviewRequest) returns (DashboardOverviewResponse);

  // 岗位创建趋势。
  rpc GetJobTrend(DashboardTrendRequest) returns (DashboardTrendResponse);

  // 简历/投递趋势。
  rpc GetApplicationTrend(DashboardTrendRequest) returns (DashboardTrendResponse);

  // 热门岗位榜单。
  rpc GetHotJobs(DashboardHotJobsRequest) returns (DashboardHotJobsResponse);

  // 热门技能榜单。
  rpc GetHotSkills(DashboardHotSkillsRequest) returns (DashboardHotSkillsResponse);

  // 候选人漏斗数据。
  rpc GetCandidateFunnel(DashboardFunnelRequest) returns (DashboardFunnelResponse);

  // AI 聊天统计。
  rpc GetAIMatchStats(DashboardAIMatchRequest) returns (DashboardAIMatchResponse);
}

// DashboardOverviewRequest 只需要传入当前 HR 的 ID。
message DashboardOverviewRequest {
  uint64 hr_id = 1;
}

// DashboardOverviewResponse 汇总 HR 仪表盘顶部指标。
message DashboardOverviewResponse {
  int64 total_jobs = 1;
  int64 online_jobs = 2;
  int64 offline_jobs = 3;
  int64 total_applications = 4;
  int64 total_candidates = 5;
  int64 complete_profiles = 6;
  int64 total_resumes = 7;
  int64 total_chats = 8;
}

// DashboardTrendRequest 用于按日期范围查询趋势数据。
message DashboardTrendRequest {
  uint64 hr_id = 1;
  string start_date = 2;
  string end_date = 3;
  string range = 4;
}

// DashboardTrendResponse 返回按天聚合的点位数据。
message DashboardTrendResponse {
  repeated TrendPoint points = 1;
}

message TrendPoint {
  string date = 1;
  int64 count = 2;
}

message DashboardHotJobsRequest {
  uint64 hr_id = 1;
  int32 limit = 2;
}

message DashboardHotJobsResponse {
  repeated HotJobItem jobs = 1;
}

message HotJobItem {
  uint64 job_id = 1;
  string title = 2;
  string location = 3;
  string salary = 4;
  int64 application_count = 5;
}

message DashboardHotSkillsRequest {
  uint64 hr_id = 1;
  int32 limit = 2;
}

message DashboardHotSkillsResponse {
  repeated HotSkillItem skills = 1;
}

message HotSkillItem {
  string skill = 1;
  int64 count = 2;
}

message DashboardFunnelRequest {
  uint64 hr_id = 1;
}

message DashboardFunnelResponse {
  int64 registered = 1;
  int64 profile_complete = 2;
  int64 resume_uploaded = 3;
  int64 applied = 4;
}

message DashboardAIMatchRequest {
  uint64 hr_id = 1;
}

message DashboardAIMatchResponse {
  int64 total_chats = 1;
  int64 hr_messages = 2;
  int64 ai_messages = 3;
  int64 match_tasks = 4;
  int64 success_tasks = 5;
  int64 failed_tasks = 6;
  double average_score = 7;
}
